let state={mode:'',items:[],index:0,answers:[],locked:false};
const $=id=>document.getElementById(id),sections=['home','list','quiz','result'];
function show(id){sections.forEach(x=>$(x).classList.toggle('hidden',x!==id));window.scrollTo(0,0)}
function showHome(){show('home')} function openSite(){window.open(location.href,'_blank','noopener,noreferrer')}
function startTest(mode){state.mode=mode;state.items=mode==='random20'?[...QUESTIONS].sort(()=>Math.random()-.5).slice(0,20):[...QUESTIONS];state.index=0;state.answers=Array(state.items.length).fill(null);state.locked=false;show('quiz');renderQ()}
function renderQ(){const q=state.items[state.index],a=state.answers[state.index];$('qnum').textContent=`Вопрос ${state.index+1} из ${state.items.length}`;$('modeLabel').textContent=state.mode==='random20'?'Случайный тест':state.mode==='all'?'Полный экзамен':'Тренировка';$('bar').style.width=((state.index+1)/state.items.length*100)+'%';$('question').textContent=q.question;$('opts').innerHTML=q.options.map((o,i)=>{let cls='opt';if(state.locked){if(i===q.answer)cls+=' correct';if(a===i&&a!==q.answer)cls+=' wrong'}return `<button class="${cls}" onclick="choose(${i})" ${state.locked?'disabled':''}>${i+1}. ${escapeHtml(o)}</button>`}).join('');$('prev').disabled=state.index===0;$('next').textContent=state.locked?(state.index===state.items.length-1?'Результат':'Следующий'):'Ответить';$('feedback').classList.toggle('hidden',!state.locked);if(state.locked){const ok=a===q.answer;$('feedback').textContent=ok?'✓ Правильно':'✕ Неверно — правильный ответ: '+(q.answer+1)+'. '+q.options[q.answer];$('feedback').className='feedback '+(ok?'good':'bad')}else{$('feedback').textContent='';$('feedback').className='feedback hidden'}}
function choose(i){if(state.locked)return;state.answers[state.index]=i;state.locked=true;renderQ();setTimeout(()=>{if(state.locked&&state.answers[state.index]===i)nextQ()},1000)}
function nextQ(){if(!state.locked)return;if(state.index<state.items.length-1){state.index++;state.locked=false;renderQ()}else finish()}
function prevQ(){if(state.index===0)return;state.index--;state.locked=state.answers[state.index]!==null;renderQ()}
function finish(){const correct=state.answers.reduce((n,a,i)=>n+(a===state.items[i].answer?1:0),0),pct=Math.round(correct/state.items.length*100);$('score').textContent=`${correct} / ${state.items.length}`;$('resultTitle').textContent=pct>=90?'Отличный результат!':pct>=70?'Хороший результат':'Есть что повторить';$('resultText').textContent=`Правильных ответов: ${pct}%. Ошибки можно посмотреть в разборе.`;show('result')}
function showReview(){const r=$('review');r.classList.toggle('hidden');r.innerHTML=state.items.map((q,i)=>{const ok=state.answers[i]===q.answer;return `<div class="reviewItem"><b>${i+1}. ${escapeHtml(q.question)}</b><div class="${ok?'r':'w'}">${ok?'✓ Правильно':'✕ Ошибка'} — ваш ответ: ${state.answers[i]===null?'нет ответа':state.answers[i]+1}; правильный: ${q.answer+1}</div></div>`}).join('')}
function showList(){show('list');renderList()}
function renderList(){const term=$('search').value.toLowerCase(),f=$('filter').value;let arr=QUESTIONS.filter((q,i)=>{const hit=(q.question+' '+q.options.join(' ')).toLowerCase().includes(term),a=state.answers[i];return hit&&(f==='all'||(f==='answered'&&a!==null)||(f==='wrong'&&a!==null&&a!==q.answer))});$('listBody').innerHTML=arr.map(q=>`<div class="reviewItem"><b>${q.id}. ${escapeHtml(q.question)}</b><div class="sub">${q.options.map((o,i)=>`${i+1}. ${escapeHtml(o)}`).join(' · ')}</div></div>`).join('')||'<div class="sub">Ничего не найдено.</div>'}
function confirmExit(){if(confirm('Выйти из текущего теста?'))showHome()}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
</script></body></html>
